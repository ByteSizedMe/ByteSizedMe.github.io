<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byte | Case File</title>
  <meta name="description" content="Byte: Software Engineer, Application Security &amp; Mobile. An investigation board of projects and notes.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Noto+Sans+JP:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 class="sr-only">Byte: Software Engineer, Application Security &amp; Mobile</h1>

  <main id="viewport" class="viewport">
    <div id="world" class="world">
      <svg id="strings" class="strings" aria-hidden="true" focusable="false"></svg>
      <!-- cards and stamps are rendered here by js/board.js from js/content.js -->
    </div>
  </main>

  <div id="hud" class="hud" role="group" aria-label="Camera controls">
    <button type="button" class="hud__btn" data-cam="zoom-out" aria-label="Zoom out">&minus;</button>
    <button type="button" class="hud__btn" data-cam="zoom-in" aria-label="Zoom in">+</button>
    <span class="hud__zoom"><span class="hud__zoom-label">ZOOM</span> <output id="zoom-readout" aria-live="off">100%</output></span>
    <button type="button" class="hud__btn hud__btn--wide" data-cam="fit" aria-label="Fit all cards in view">FIT ALL</button>
    <button type="button" class="hud__btn hud__btn--wide" data-cam="reset" aria-label="Reset view to the subject file at 100 percent">RESET</button>
  </div>

  <div id="minimap" class="minimap" aria-hidden="true">
    <div id="minimap-view" class="minimap__view"></div>
  </div>

  <noscript><p class="noscript">This case board needs JavaScript. Contact: see README.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
