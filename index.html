<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Malhar Srivatsav | Case File</title>
  <meta name="description" content="Malhar Srivatsav: Software Engineer, Application Security &amp; Mobile. An investigation board of projects and notes.">
  <meta name="author" content="Malhar Srivatsav">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Malhar Srivatsav | Case File">
  <meta property="og:description" content="Malhar Srivatsav: Software Engineer, Application Security &amp; Mobile. An investigation board of projects and notes.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Malhar Srivatsav | Case File">
  <meta name="twitter:description" content="Malhar Srivatsav: Software Engineer, Application Security &amp; Mobile.">
  <!-- TODO: add <meta property="og:image"> (and twitter:image) once there is a preview image.
       Link previews need an ABSOLUTE https URL, e.g. https://bytesizedme.github.io/assets/og-image.png -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load without blocking first paint (the CSS has fallbacks and font-display: swap) -->
  <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Noto+Sans+JP:wght@700&family=Special+Elite&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Noto+Sans+JP:wght@700&family=Special+Elite&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Decided before first paint so nothing flashes: (1) list view (html.list-mode) when it
       was chosen this session or ?view=list; (2) whether the intro plays: once per session,
       never under reduced motion or in list view; ?intro=1 replays it, ?intro=0 skips it.
       js/list.js and js/intro.js take over from here. */
    (function () {
      try {
        var v = location.search.match(/[?&]view=(list|board)/);
        var list = v ? v[1] === 'list' : sessionStorage.getItem('bytesized.view') === 'list';
        if (list) document.documentElement.classList.add('list-mode');
        var q = location.search.match(/[?&]intro=(\d)/);
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var play = !list && !reduced && (q ? q[1] === '1' : !sessionStorage.getItem('bytesized.intro'));
        if (play) {
          document.documentElement.classList.add('intro-pending');
          // failsafe: never leave the board hidden if the intro script does not start
          setTimeout(function () { document.documentElement.classList.remove('intro-pending'); }, 4000);
        }
      } catch (e) { /* storage blocked: just skip the intro */ }
    })();
  </script>
</head>
<body>
  <header class="page-head">
    <h1 class="sr-only board-h1">Malhar Srivatsav: Software Engineer, Application Security &amp; Mobile</h1>

    <div id="view-switch" class="view-switch" role="group" aria-label="View">
      <button type="button" class="view-switch__btn" data-view="board" aria-pressed="true">BOARD VIEW</button>
      <button type="button" class="view-switch__btn" data-view="list" aria-pressed="false">LIST VIEW</button>
    </div>
  </header>

  <div id="hud" class="hud" role="region" aria-label="Camera controls">
    <button type="button" class="hud__btn" data-cam="zoom-out" aria-label="Zoom out">&minus;</button>
    <button type="button" class="hud__btn" data-cam="zoom-in" aria-label="Zoom in">+</button>
    <span class="hud__zoom"><span class="hud__zoom-label">ZOOM</span> <output id="zoom-readout" aria-live="off">100%</output></span>
    <button type="button" class="hud__btn hud__btn--wide" data-cam="fit" aria-label="Fit all cards in view">FIT ALL</button>
    <button type="button" class="hud__btn hud__btn--wide" data-cam="reset" aria-label="Reset view to the subject file">RESET</button>
  </div>

  <main id="viewport" class="viewport" aria-label="Case board">
    <div id="world" class="world">
      <svg id="strings" class="strings" aria-hidden="true" focusable="false"></svg>
      <!-- cards and stamps are rendered here by js/board.js from js/content.js -->
    </div>
  </main>

  <div id="minimap" class="minimap" aria-hidden="true">
    <div id="minimap-view" class="minimap__view"></div>
  </div>

  <!-- film grain and scanlines: pure CSS, very low opacity, on top of the board -->
  <div class="fx fx--grain" aria-hidden="true"></div>
  <div class="fx fx--scan" aria-hidden="true"></div>

  <main id="list-view" class="list-view" aria-label="Case files"></main>

  <noscript><p class="noscript">This case board needs JavaScript. Contact: see README.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/list.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
